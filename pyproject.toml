[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loop-research"
version = "0.1.0"
description = "Subscription-backed RLM research with a gated WideSearch skill loop"
requires-python = ">=3.12"
dependencies = [
  "rlms @ git+https://github.com/alexzhang13/rlm.git@d04208afbad29ca675ab13478c40ee8bebc84bfe",
  "pydantic>=2.10,<3", "typer>=0.15,<1", "PyYAML>=6,<7", "pandas==2.3.1",
  "numpy>=2,<3", "dateparser>=1.2,<2", "loguru>=0.7,<1", "pandarallel==1.6.5",
  "datasets>=3,<6", "huggingface-hub>=0.30,<3", "matplotlib>=3.9,<4"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
loop-research = "loop_research.cli:app"
[tool.hatch.metadata]
allow-direct-references = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: real subscription and web calls, explicitly run by user only"]
