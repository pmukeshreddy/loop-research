[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loop-research"
version = "0.1.0"
description = "Subscription-backed research with a continual harness"
requires-python = ">=3.12"
dependencies = [
  "rlms @ git+https://github.com/alexzhang13/rlm.git@d04208afbad29ca675ab13478c40ee8bebc84bfe",
  "pydantic>=2.10,<3", "typer>=0.15,<1", "PyYAML>=6,<7", "pandas==2.3.1",
  "numpy>=2,<3", "dateparser>=1.2,<2", "loguru>=0.7,<1", "pandarallel==1.6.5",
  "datasets>=3,<6", "huggingface-hub>=0.30,<3", "matplotlib>=3.9,<4",
  "openai==3.35.1", "camoufox==0.5.8", "perplexityai>=0.40,<0.41",
  "orjson>=3.10", "rapidfuzz>=3.9", "jinja2>=3.1", "tqdm>=4.66",
  "jsonschema==4.26.0", "referencing==0.37.0"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
loop-research = "loop_research.cli:app"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "loop_research/config.yaml"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: real subscription and web calls, explicitly run by user only"]
